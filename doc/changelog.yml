  notes: "fix: Ensure .gitignore file is never committed\nfix(test): Repair unit test setup and improve coverage\nDevelopment mode for Idna-2.0.0alpha5\nReleased Idna-2.0.0alpha4\nUpgrade workflows\nUpdate metadata and workflows for PHP 8 support\nAdd CI job for satis repo update\nno errors, ci.yml added and bootstrap.php adapted\nno errors\nno errors left\nDevelopment mode for Idna-2.0.0alpha5\nReleased Idna-2.0.0alpha3\nDevelopment mode for Idna-2.0.0alpha4\nReleased Idna-2.0.0alpha2\nDevelopment mode for Idna-2.0.0alpha3\nReleased Idna-2.0.0alpha1\nComponents updated the package files.\nMerge pull request #2 from ChristophWurst/fix/encode-null-horde\nFix encoding null with PHP8.1\nUpdate supported PHP versions and configuration names.\n[mjr] PHP 7.4 compatibility fixes (Remi Collet <remi@famillecollet.com>, PR #1).\nMerge pull request #1 from remicollet/issue-php74\nFix Trying to access array offset on value of type null\nStandardize descriptions.\nAdd chomp character.\nEnable PHP 7.3 CI.\nUpdate package definitions.\nFix getting exit code on PHP 7.2+.\nMark Chuck and Michael as inactive.\npackage.xml must not contain empty <notes> tags.\nCreate CHANGES for all components.\nRegenerate package.xml from changelog.yml.\nBuild changelog.yml from existing changelog(s).\nUpdate .horde.yml with extended information.\nUpdate composer.json.\nEnable 7.2 builds.\nPEAR on 5.6 and 7.0 is fixed.\nUpdate file list\nMove phpunit configuration to base directory.\nIndicate markup language.\nUpdate references to COPYING files.\nUse LICENSE consistently and move to base directory.\nStop flooding #horde channel.\nUse https URLs.\nInstall all dependencies but PECL extensions.\nHopefully this finally fixes Travis builds now.\nAlways discover channel manually, due to Travis bug.\nFix Travis tests.\nAdd Travis configuration and .gitignore files.\nUpdated\nUpdate de translation.\nDevelopment mode for Horde_Idna-1.1.2"
